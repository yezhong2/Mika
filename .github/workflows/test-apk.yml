name: Mika Dev APK

# Build the owner's feature branch without requiring a PR or a main-branch push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build and upload Mika Perf
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # 固定签名：runner 自带的 debug.keystore 每次都不一样，两次出包互盖不上。
      # 没配 secret 时这一步不改任何东西，构建照旧走 debug 签名。
      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MIKA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mika.jks"
            echo "用固定 keystore 签名（MIKA_KEYSTORE）"
          else
            echo "没配 MIKA_KEYSTORE_B64，本次用 runner 的临时 debug 签名"
          fi
      - name: Build APK
        shell: bash
        env:
          MIKA_KEYSTORE_PASSWORD: ${{ secrets.MIKA_KEYSTORE_PASSWORD }}
          MIKA_KEY_ALIAS: ${{ secrets.MIKA_KEY_ALIAS }}
          MIKA_KEY_PASSWORD: ${{ secrets.MIKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/mika.jks" ]; then
            export MIKA_KEYSTORE="$RUNNER_TEMP/mika.jks"
          fi
          ./gradlew :app:assemblePerf --stacktrace
      - name: Prepare download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/test-apk
          task_apk_name="Mika-Perf-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/perf/app-arm64-v8a-perf.apk "dist/test-apk/${task_apk_name}"
          (cd dist/test-apk && sha256sum *.apk > SHA256SUMS.txt)
          {
            printf '%s\n' '## Mika Perf APK'
            printf '%s\n' 'Download the Mika-Dev artifact below, unzip it, and install the APK.'
            printf '%s\n' 'Package: com.yezhong2.mika (fork build, debug-signed). It installs alongside the official Mika; configure model and phone permissions separately.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: Mika-Perf-${{ github.sha }}
          path: dist/test-apk/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Mika-Perf-test-results-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
